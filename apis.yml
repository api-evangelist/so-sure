name: So Sure
description: So Sure (wearesosure.com), operated by Open Insurance Services UK Limited, was a UK
  app-based social insurance provider offering mobile phone and home contents insurance, known for a
  social/peer insurance model that rewarded claim-free groups. It was an early portfolio company of
  500 Global. The company has stopped selling new policies and has transitioned its mobile phone
  cover to the Huddle Insurance brand while continuing to service existing customers. So Sure
  publishes no public developer program, API, SDK, or technical documentation surface.
